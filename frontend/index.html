<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Private Cloud</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>My Private Cloud</h1>
    <p>Your personal file storage.</p>

<div id="auth-section">   
<div class="auth-tabs">
    <button type="button" id="show-login">Login</button>
    <button type="button" id="show-register">Create Account</button>
</div>

<section id="login-section">
    <h2>Login</h2>
    <form id="login-form">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>

        <label for="password">Password</label>
        <div class="password-field">
            <input type="password" id="password" name="password" required>
            <button type="button" class="toggle-password" data-target="password">Show</button>
        </div>

        <button type="submit">Login</button>
        <p id="login-message"></p>
    </form>
</section>

<section id="register-section" hidden>
    <h2>Create Account</h2>
    <form id="register-form">
        <label for="register-username">Username</label>
        <input type="text" id="register-username" name="username"
               minlength="3" maxlength="50" required>

        <label for="register-password">Password</label>
        <div class="password-field">
            <input type="password" id="register-password" name="password"
                minlength="8" maxlength="128" required>
            <button type="button" class="toggle-password" data-target="register-password">Show</button>
        </div>

        <button type="submit">Register</button>
        <p id="register-message"></p>
    </form>
</section>
</div>

<section id="files-section" hidden>
    <h2>My Files</h2>
    <button type="button" id="logout-button">Log Out</button>
    <form id="upload-form">
    <input type="file" id="file-input" name="uploaded_file" required>
    <progress id="upload-progress" value="0" max="100" hidden></progress>
    <p id="upload-progress-text" hidden></p>
    <button type="submit">Upload File</button>
</form>
<p id="upload-message"></p>

    <button type="button" id="load-files">Refresh Files</button>

    <p id="files-message"></p>

    <ul id="files-list"></ul>
</section>


<script src="app.js"></script>

<footer class="site-footer">
    Created by Majd Mosrur
</footer>

</body>
</html>
